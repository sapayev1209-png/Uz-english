name: Android Debug APK CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build UzEnglish AI Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK and install API 36.1 platform
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Error: Android SDK directory not found at $SDK_DIR" >&2
            exit 1
          fi

          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          CMDLINE_BIN="$SDK_DIR/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE_BIN/sdkmanager" ]; then
            CMDLINE_BIN="$(dirname "$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)")"
          fi
          if [ -z "$CMDLINE_BIN" ] || [ ! -x "$CMDLINE_BIN/sdkmanager" ]; then
            echo "Error: sdkmanager binary not found under $SDK_DIR/cmdline-tools" >&2
            exit 1
          fi

          export PATH="$CMDLINE_BIN:$SDK_DIR/platform-tools:$PATH"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_DIR" --licenses > /dev/null
          set -o pipefail

          "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          test -d "$SDK_DIR/platforms/android-36.1"
          test -d "$SDK_DIR/build-tools/36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure Gradle Wrapper is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Prepare environment defaults (.env & debug.keystore)
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit Tests
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --tests "com.example.ExampleRobolectricTest" --no-daemon
          else
            gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --tests "com.example.ExampleRobolectricTest" --no-daemon
          fi

      - name: Assemble Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify generated APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: uzenglish-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
